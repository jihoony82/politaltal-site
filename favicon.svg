<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 정치탈탈: 네이비 배경 + 골드 인장 디스크 + 네이비 '정' (앱 아이콘과 통일) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a5f"/>
      <stop offset="1" stop-color="#0a2540"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <circle cx="16" cy="15" r="11" fill="#d4af37" stroke="#8a6914" stroke-width="0.7"/>
  <circle cx="16" cy="15" r="9.6" fill="none" stroke="#0a2540" stroke-width="0.5" opacity="0.5"/>
  <text x="16" y="20.3" text-anchor="middle"
        font-family="-apple-system, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        font-size="13.5" font-weight="900" fill="#0a2540">정</text>
  <rect x="12.2" y="27.4" width="7.6" height="1.3" rx="0.6" fill="#d4af37"/>
</svg>
