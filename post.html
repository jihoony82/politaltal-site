  <main><section class="page-hero" style="background-image: linear-gradient(180deg, rgba(10,37,64,.72) 0%, rgba(10,37,64,.88) 100%), url('/videos/hero-community.jpg'); background-size: cover; background-position: center 45%;">  <div class="container">    <span class="ph-icon">💬</span>    <div class="ph-title">정치탈탈 커뮤니티</div>    <div class="ph-sub">국회 생중계 함께 보기 + 정책 토론</div>  </div></section>
    <div class="container" style="max-width:680px;">
      <a href="/community.html" class="back-link">← 게시판으로 돌아가기</a>

      <div id="postDetailContainer">
        <div style="text-align:center;padding:60px 20px;color:#cbd5e1;font-size:14px;letter-spacing:8px;">···</div>
      </div>
    </div>

    <script>
      (function(){
        const API_BASE = 'https://politaltal-comments.jihoony821209.workers.dev';
        const POST_API = API_BASE + '/post';                  // GET ?id=N (단일 글 + 댓글 + 좋아요)
        const POST_VIEW_API = API_BASE + '/post-view';        // POST {id}
        const POST_LIKE_API = API_BASE + '/post-like';        // POST {id}
        const POST_COMMENT_API = API_BASE + '/post-comment';  // POST {post_id, body}
        const REPORT_POST_API = API_BASE + '/report-post';
        const REPORT_COMMENT_API = API_BASE + '/report-post-comment';
        const MEMBER_MARKER_RE = /\[member:([A-Za-z0-9]{6,12})\]/g;
        let MEMBERS_INDEX = null;
        let CURRENT_POST_ID = null;

        function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':s); return d.innerHTML; }
        function timeAgo(ts){
          const s = Math.max(0, Math.floor((Date.now() - Number(ts||0)) / 1000));
          if (s < 60) return '방금';
          if (s < 3600) return Math.floor(s/60) + '분 전';
          if (s < 86400) return Math.floor(s/3600) + '시간 전';
          if (s < 86400*7) return Math.floor(s/86400) + '일 전';
          try { return new Date(Number(ts)).toLocaleString('ko-KR'); } catch(e){ return ''; }
        }

        async function loadMembersIndex(){
          if (MEMBERS_INDEX) return MEMBERS_INDEX;
          try {
            const r = await fetch('/data/members-mini.json');
            MEMBERS_INDEX = await r.json();
          } catch(e){ MEMBERS_INDEX = {}; }
          return MEMBERS_INDEX;
        }
        function renderMemberCard(monaCd){
          const m = MEMBERS_INDEX && MEMBERS_INDEX[monaCd];
          if (!m) {
            return '<div class="embedded-member-card missing">📍 의원 카드: 정보를 찾을 수 없습니다 (' + esc(monaCd) + ')</div>';
          }
          const photo = m.photo
            ? '<img class="emc-photo" src="' + esc(m.photo) + '" alt="' + esc(m.name) + '" loading="lazy">'
            : '<div class="emc-photo-fallback">' + esc((m.name || '?').charAt(0)) + '</div>';
          const partyChip = m.party ? '<span class="emc-party">' + esc(m.party) + '</span>' : '';
          const meta = [m.district, m.term].filter(Boolean).join(' · ');
          return '<a href="/politician/' + esc(monaCd) + '.html" class="embedded-member-card">' +
            photo +
            '<div class="emc-info">' +
              '<div class="emc-name">' + esc(m.name || '') + ' ' + partyChip + '</div>' +
              '<div class="emc-meta">' + esc(meta || '') + (meta ? ' · ' : '') + '데이터 보기</div>' +
            '</div>' +
            '<span class="emc-arrow">→</span>' +
          '</a>';
        }
        function renderPostBody(text){
          const src = text || '';
          let html = '', last = 0, m;
          MEMBER_MARKER_RE.lastIndex = 0;
          while ((m = MEMBER_MARKER_RE.exec(src)) !== null) {
            if (m.index > last) html += esc(src.slice(last, m.index));
            html += renderMemberCard(m[1]);
            last = m.index + m[0].length;
          }
          if (last < src.length) html += esc(src.slice(last));
          return html;
        }

        function getPostId(){
          const id = parseInt(new URLSearchParams(location.search).get('id') || '', 10);
          return id > 0 ? id : null;
        }

        function renderNotFound(c, msg){
          c.innerHTML = '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:20px;margin:20px 0;color:#991b1b;font-size:13px;line-height:1.7;text-align:center;">' +
            '⚠️ <strong>' + esc(msg || '게시글을 찾을 수 없어요.') + '</strong><br>' +
            '<a href="/community.html" style="color:#dc2626;font-weight:700;margin-top:10px;display:inline-block;">← 게시판으로 돌아가기</a>' +
            '</div>';
        }

        function renderComment(c){
          return '<div class="comment-item" data-id="' + c.id + '">' +
            '<div class="comment-head">' +
              '<span class="comment-nick">' + esc(c.nickname||'') + '</span>' +
              '<span class="comment-time">' + esc(timeAgo(c.created_at)) + '</span>' +
              '<button class="comment-report" onclick="reportComment(' + c.id + ', this)" title="신고">🚩</button>' +
            '</div>' +
            '<div class="comment-body">' + esc(c.body||'') + '</div>' +
          '</div>';
        }

        function renderComments(comments){
          const list = document.getElementById('commentList');
          if (!list) return;
          if (!comments || !comments.length) {
            list.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:12.5px;">첫 번째 댓글을 남겨보세요.</div>';
            return;
          }
          list.innerHTML = comments.map(renderComment).join('');
        }

        async function loadPost(){
          const c = document.getElementById('postDetailContainer');
          if (!c) return;
          const id = getPostId();
          if (!id) { renderNotFound(c, '잘못된 접근입니다.'); return; }
          CURRENT_POST_ID = id;
          await loadMembersIndex();
          let d;
          try {
            const r = await fetch(POST_API + '?id=' + id + '&_=' + Date.now(), { cache: 'no-store' });
            if (r.status === 404) { renderNotFound(c, '삭제된 글이거나 존재하지 않는 글입니다.'); return; }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            d = await r.json();
          } catch(err){
            c.innerHTML = '<div style="text-align:center;padding:30px;color:#dc2626;font-size:13px;">⚠️ 글 불러오기 실패: ' + esc(String(err.message||err)) + '</div>';
            return;
          }
          if (!d || !d.ok || !d.post) { renderNotFound(c, '서버 응답이 비정상입니다.'); return; }
          const p = d.post;

          try { document.title = p.title + ' — 정치탈탈 커뮤니티'; } catch(e){}

          c.innerHTML =
            '<div class="post-detail-card">' +
              '<div class="post-meta" style="margin-bottom:12px;">' +
                '<span class="post-category">' + esc(p.category||'') + '</span>' +
                '<span>👤 ' + esc(p.nickname||'') + ' · ' + esc(timeAgo(p.created_at)) + '</span>' +
                '<button class="post-report-btn" onclick="reportPostDetail(' + p.id + ', this)" title="신고">🚩 신고</button>' +
              '</div>' +
              '<h1 class="post-detail-title">' + esc(p.title||'') + '</h1>' +
              '<div class="post-detail-body">' + renderPostBody(p.body||'') + '</div>' +
              '<div class="post-detail-actions">' +
                '<button class="like-btn ' + (d.liked ? 'liked' : '') + '" id="likeBtn" onclick="toggleLike(' + p.id + ')">' +
                  '<span class="like-icon">' + (d.liked ? '❤️' : '🤍') + '</span> <span class="like-count">' + (d.like_count||0) + '</span>' +
                '</button>' +
                '<div class="post-stats" style="margin-top:0;">' +
                  '<span id="viewCount">👁 ' + (p.view_count||0) + '</span>' +
                  '<span id="commentCount">💬 ' + (d.comments ? d.comments.length : 0) + '</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="post-detail-card" style="margin-top:14px;">' +
              '<h2 style="font-size:14px;font-weight:800;color:var(--color-primary);margin-bottom:12px;">💬 댓글 <span id="commentCntInline" style="font-weight:600;color:var(--color-text-soft);">(' + (d.comments ? d.comments.length : 0) + ')</span></h2>' +
              '<div id="commentList" class="comment-list"></div>' +
              '<div class="comment-composer">' +
                '<textarea id="commentInput" maxlength="800" rows="3" placeholder="댓글을 남겨보세요. 비방·허위사실은 신고 시 삭제될 수 있어요." style="width:100%;border:1px solid var(--color-border);border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;resize:vertical;"></textarea>' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">' +
                  '<span style="font-size:11px;color:var(--color-text-soft);">닉네임 자동 부여 · 최대 800자</span>' +
                  '<button class="comment-submit" onclick="submitComment()" style="background:var(--color-accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;">등록</button>' +
                '</div>' +
              '</div>' +
            '</div>';

          renderComments(d.comments || []);

          // 조회수 증가 (fire-and-forget)
          fetch(POST_VIEW_API, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id: p.id }) })
            .then(function(r){ return r.json(); })
            .then(function(){
              const v = document.getElementById('viewCount');
              if (v) v.textContent = '👁 ' + ((p.view_count||0) + 1);
            })
            .catch(function(){});
        }

        window.reportPostDetail = async function(id, btn){
          if (!confirm('이 글을 신고할까요? (비방·허위사실·명예훼손 등)')) return;
          try {
            await fetch(REPORT_POST_API, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id: id }) });
            if (btn) { btn.disabled = true; btn.textContent = '신고됨'; btn.style.opacity = '0.5'; }
          } catch(e){ alert('신고 처리 중 오류가 발생했어요.'); }
        };

        window.reportComment = async function(id, btn){
          if (!confirm('이 댓글을 신고할까요?')) return;
          try {
            await fetch(REPORT_COMMENT_API, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id: id }) });
            const item = btn && btn.closest('.comment-item');
            if (item) { item.style.opacity = '0.4'; btn.textContent = '신고됨'; }
          } catch(e){ alert('신고 처리 중 오류'); }
        };

        // 서버 좋아요 토글
        window.toggleLike = async function(id){
          const btn = document.getElementById('likeBtn');
          if (btn) btn.disabled = true;
          try {
            const r = await fetch(POST_LIKE_API, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id: id }) });
            const d = await r.json();
            if (!d || !d.ok) {
              alert('좋아요 처리 실패: ' + (d && d.error || '서버 오류'));
              return;
            }
            if (btn) {
              const icon = btn.querySelector('.like-icon');
              const cnt = btn.querySelector('.like-count');
              if (icon) icon.textContent = d.liked ? '❤️' : '🤍';
              if (cnt) cnt.textContent = d.like_count;
              btn.classList.toggle('liked', d.liked);
            }
          } catch(e){
            alert('네트워크 오류');
          } finally {
            if (btn) btn.disabled = false;
          }
        };

        window.submitComment = async function(){
          if (!CURRENT_POST_ID) return;
          const ta = document.getElementById('commentInput');
          const body = (ta && ta.value || '').trim();
          if (!body) { ta && ta.focus(); return; }
          const btn = document.querySelector('.comment-submit');
          if (btn) { btn.disabled = true; btn.textContent = '등록 중…'; }
          try {
            const r = await fetch(POST_COMMENT_API, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ post_id: CURRENT_POST_ID, body: body }),
            });
            const d = await r.json();
            if (r.status === 429) {
              const sec = Math.ceil((d.retry_in_ms || 5000) / 1000);
              alert(sec + '초 후 다시 시도해주세요.');
              return;
            }
            if (d && d.error === 'post_comments_table_not_initialized') {
              alert('댓글 DB가 아직 준비되지 않았습니다. 운영자에게 알려주세요.');
              return;
            }
            if (!d || !d.ok) { alert('등록 실패: ' + (d && d.error || '서버 오류')); return; }
            ta.value = '';
            // 댓글 목록 다시 불러오기
            const rr = await fetch(POST_API + '?id=' + CURRENT_POST_ID + '&_=' + Date.now(), { cache: 'no-store' });
            const dd = await rr.json();
            if (dd && dd.ok) {
              renderComments(dd.comments || []);
              const cnt = (dd.comments || []).length;
              const inline = document.getElementById('commentCntInline');
              const stat = document.getElementById('commentCount');
              if (inline) inline.textContent = '(' + cnt + ')';
              if (stat) stat.textContent = '💬 ' + cnt;
            }
          } catch(e){
            alert('네트워크 오류');
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = '등록'; }
          }
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadPost);
        } else {
          loadPost();
        }
      })();
    </script>

  <script>
    // 정치 용어 tooltip — 모바일 tap-to-show, 다시 탭하면 닫기
    document.addEventListener('click', function(e) {
      const t = e.target.closest('.term-tip');
      if (t) {
        document.querySelectorAll('.term-tip.tt-active').forEach(function(x) {
          if (x !== t) x.classList.remove('tt-active');
        });
        t.classList.toggle('tt-active');
        e.stopPropagation();
      } else {
        document.querySelectorAll('.term-tip.tt-active').forEach(function(x) {
          x.classList.remove('tt-active');
        });
      }
    });
  </script>
