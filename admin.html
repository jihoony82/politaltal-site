<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>정치탈탈 관리자 통계</title>
  <style>
    :root { --navy:#0a2540; --primary:#ff5e3a; --soft:#64748b; --border:#e2e8f0; }
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background:#f5f7fa; color:var(--navy); margin:0; padding:24px 16px; -webkit-font-smoothing:antialiased; }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size:20px; margin:0 0 4px; }
    .sub { font-size:12px; color:var(--soft); margin-bottom:20px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:14px; box-shadow:0 2px 10px rgba(10,37,64,.05); }
    .big { font-size:40px; font-weight:900; color:var(--primary); line-height:1; }
    .label { font-size:12px; color:var(--soft); margin-top:6px; font-weight:600; }
    .keybox { display:flex; gap:8px; }
    .keybox input { flex:1; border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px; }
    .keybox button, .reset { background:var(--navy); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer; }
    .reset { background:#fff; color:var(--soft); border:1px solid var(--border); font-weight:500; padding:6px 12px; font-size:12px; }
    .row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
    .row:last-child { border-bottom:none; }
    .row .d { width:96px; color:var(--soft); }
    .bar { flex:1; height:10px; background:#eef2f7; border-radius:5px; overflow:hidden; }
    .bar > div { height:100%; background:var(--primary); border-radius:5px; }
    .row .c { width:48px; text-align:right; font-weight:700; }
    .err { color:#dc2626; font-size:13px; }
    .note { font-size:11px; color:var(--soft); line-height:1.6; margin-top:8px; }
    a { color:var(--primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📊 정치탈탈 관리자 통계</h1>
    <div class="sub">로그인 집계 (개인정보 미수집 · 날짜별 카운트만)</div>

    <div id="keyCard" class="card" style="display:none;">
      <div class="label" style="margin-bottom:8px;">관리자 키 입력</div>
      <div class="keybox">
        <input type="password" id="keyInput" placeholder="관리자 키" autocomplete="off">
        <button onclick="saveKey()">확인</button>
      </div>
      <div id="keyErr" class="err" style="margin-top:8px;"></div>
    </div>

    <div id="dash" style="display:none;">
      <div class="card">
        <div style="display:flex; gap:32px;">
          <div><div class="big" style="font-size:32px;" id="tvVisits">–</div><div class="label">방문 (최근 30일)</div></div>
          <div><div class="big" style="font-size:32px; color:var(--navy);" id="tvViews">–</div><div class="label">페이지뷰 (최근 30일)</div></div>
        </div>
        <div id="tvNote" class="note"></div>
      </div>

      <div class="card">
        <div class="big" id="total">–</div>
        <div class="label">누적 로그인 수</div>
      </div>
      <div class="card">
        <div class="label" style="margin-bottom:10px;">최근 일별 로그인</div>
        <div id="daily"></div>
      </div>
      <button class="reset" onclick="resetKey()">키 변경 / 로그아웃</button>
      <div class="note">
        ※ 이 수치는 로그인 “이벤트” 횟수입니다(같은 사람 재로그인 포함). 닉네임·프로필 등 개인정보는 저장하지 않습니다.<br>
        ※ 일반 방문자·페이지뷰 통계는 Cloudflare 대시보드 → Web Analytics에서 볼 수 있어요.
      </div>
    </div>
  </div>

  <script>
    const API = 'https://politaltal-comments.jihoony821209.workers.dev/stats';
    const TRAFFIC_API = 'https://politaltal-comments.jihoony821209.workers.dev/traffic';
    const KEY_STORE = 'politaltal.adminKey';

    async function loadTraffic() {
      const key = localStorage.getItem(KEY_STORE);
      const note = document.getElementById('tvNote');
      try {
        const r = await fetch(TRAFFIC_API + '?key=' + encodeURIComponent(key));
        const d = await r.json();
        if (d.ok) {
          document.getElementById('tvVisits').textContent = (d.total_visits || 0).toLocaleString();
          document.getElementById('tvViews').textContent = (d.total_pageviews || 0).toLocaleString();
          note.textContent = 'Cloudflare Web Analytics 실데이터 · 쿠키리스 (개인정보 미수집)';
        } else if (d.error === 'cf_not_configured' || d.error === 'no_site_tag') {
          note.innerHTML = '⚙️ Cloudflare 트래픽 연동 전 — Worker에 <b>CF_API_TOKEN</b>·<b>CF_ACCOUNT_ID</b> 설정 필요';
        } else {
          note.textContent = '트래픽 조회 오류: ' + (d.error || '');
        }
      } catch (e) { note.textContent = '트래픽 조회 실패'; }
    }

    function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    async function load(key) {
      try {
        const r = await fetch(API + '?key=' + encodeURIComponent(key));
        if (r.status === 401) { return { unauthorized: true }; }
        const d = await r.json();
        return d;
      } catch (e) { return { error: String(e) }; }
    }

    function renderDash(d) {
      document.getElementById('keyCard').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
      document.getElementById('total').textContent = (d.total_logins || 0).toLocaleString();
      loadTraffic();
      const daily = (d.daily || []).slice().reverse(); // 오래된→최신
      const max = Math.max(1, ...daily.map(x => x.logins));
      const box = document.getElementById('daily');
      if (!daily.length) { box.innerHTML = '<div style="font-size:12px;color:#94a3b8;">아직 로그인 기록이 없어요.</div>'; return; }
      box.innerHTML = daily.map(x =>
        '<div class="row"><span class="d">' + esc(x.date) + '</span>' +
        '<span class="bar"><div style="width:' + Math.round(x.logins / max * 100) + '%"></div></span>' +
        '<span class="c">' + x.logins + '</span></div>'
      ).join('');
    }

    function showKeyForm(msg) {
      document.getElementById('dash').style.display = 'none';
      document.getElementById('keyCard').style.display = 'block';
      document.getElementById('keyErr').textContent = msg || '';
    }

    async function saveKey() {
      const k = document.getElementById('keyInput').value.trim();
      if (!k) return;
      const d = await load(k);
      if (d.ok) { localStorage.setItem(KEY_STORE, k); renderDash(d); }
      else if (d.unauthorized) showKeyForm('키가 올바르지 않습니다.');
      else showKeyForm('조회 실패: ' + (d.error || '서버 응답 오류') + ' (Worker/D1 연결 확인)');
    }

    function resetKey() { localStorage.removeItem(KEY_STORE); document.getElementById('keyInput').value=''; showKeyForm(''); }

    (async function init() {
      const saved = localStorage.getItem(KEY_STORE);
      if (!saved) { showKeyForm(''); return; }
      const d = await load(saved);
      if (d.ok) renderDash(d);
      else { localStorage.removeItem(KEY_STORE); showKeyForm(d.unauthorized ? '' : '연결 확인이 필요합니다.'); }
    })();
  </script>
</body>
</html>
