<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>로그인 - 정치탈탈</title>
  <meta name="description" content="정치탈탈 로그인. 카카오 또는 Google로 3초 만에 시작하세요.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/" class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-label="태극">
          <circle cx="16" cy="16" r="15" fill="#fff" stroke="#0a2540" stroke-width="1.5"/>
          <!-- 태극 (빨강 위 / 파랑 아래) -->
          <path d="M 16,1 A 15,15 0 0 1 16,31 A 7.5,7.5 0 0 1 16,16 A 7.5,7.5 0 0 0 16,1 Z" fill="#c8102e"/>
          <path d="M 16,1 A 15,15 0 0 0 16,31 A 7.5,7.5 0 0 0 16,16 A 7.5,7.5 0 0 1 16,1 Z" fill="#003478"/>
        </svg>
        <span>정치탈탈</span>
      </a>
      <a href="/login.html" style="font-size:12px;font-weight:700;padding:6px 12px;
                                    background:var(--color-primary);color:white;
                                    border-radius:6px;text-decoration:none;">
        로그인
      </a>
    </div>
  </header>
  <main>
    <div class="container">
      <a href="/" class="back-link">← 홈으로</a>
      <div class="section-title">🔐 로그인 / 회원가입</div>
      <div class="section-sub">관심 의원 동기화, 알림 수신을 위해 로그인하세요</div>

      <div class="stat-card" style="max-width:420px;margin:20px auto;">
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:48px;margin-bottom:12px;">🔍</div>
          <h2 style="font-size:18px;font-weight:800;">정치탈탈에 오신 것을 환영합니다</h2>
          <p style="font-size:13px;color:var(--color-text-soft);margin-top:8px;line-height:1.6;">
            카카오 계정으로 3초 만에 시작하세요
          </p>
        </div>

        <button id="kakaoLoginBtn" onclick="loginKakao()"
                style="width:100%;padding:14px;background:#FEE500;border:none;
                       border-radius:10px;font-size:15px;font-weight:700;
                       color:#191600;cursor:pointer;display:flex;align-items:center;
                       justify-content:center;gap:8px;font-family:inherit;">
          <span style="font-size:18px;">💬</span> 카카오로 계속하기
        </button>

        <button id="googleLoginBtn" onclick="loginGoogle()"
                style="width:100%;padding:14px;background:white;border:1.5px solid var(--color-border);
                       border-radius:10px;font-size:15px;font-weight:600;margin-top:10px;
                       color:var(--color-text);cursor:pointer;display:flex;align-items:center;
                       justify-content:center;gap:8px;font-family:inherit;">
          <span style="font-size:16px;">G</span> Google로 계속하기
        </button>

        <div style="display:flex;align-items:center;gap:10px;margin:18px 0;">
          <div style="flex:1;height:1px;background:var(--color-border);"></div>
          <span style="font-size:11px;color:var(--color-text-soft);">또는</span>
          <div style="flex:1;height:1px;background:var(--color-border);"></div>
        </div>

        <input type="email" id="emailInput" placeholder="이메일"
               style="width:100%;padding:12px 14px;border:1.5px solid var(--color-border);
                      border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:8px;">
        <input type="password" id="passwordInput" placeholder="비밀번호 (6자 이상)"
               style="width:100%;padding:12px 14px;border:1.5px solid var(--color-border);
                      border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:8px;">
        <button onclick="loginEmail()"
                style="width:100%;padding:12px;background:var(--color-primary);
                       border:none;border-radius:10px;color:white;font-size:14px;font-weight:700;
                       cursor:pointer;font-family:inherit;">
          이메일로 로그인
        </button>

        <p style="font-size:11px;color:var(--color-text-soft);text-align:center;margin-top:20px;line-height:1.7;">
          로그인 시 <a href="/terms.html" style="color:var(--color-primary);">이용약관</a>과
          <a href="/privacy.html" style="color:var(--color-primary);">개인정보처리방침</a>에 동의하게 됩니다.
        </p>
      </div>

      <div class="stat-card" style="background:#fef3c7;border-left:3px solid #f59e0b;">
        <h2 style="font-size:14px;color:#78350f;">🚧 베타 안내</h2>
        <p style="font-size:12px;color:#92400e;line-height:1.7;">
          현재 로그인 기능은 <strong>준비 중</strong>입니다.
          Firebase Auth + 카카오 로그인 연동 완료 후 활성화됩니다.<br>
          출시까지는 <strong>관심 의원 등록은 본인 기기 localStorage</strong>에 임시 저장됩니다.
        </p>
      </div>
    </div>

    <script>
      function loginKakao() {
        alert('카카오 로그인 준비 중입니다.\nFirebase Auth + 카카오 API 키 설정 후 활성화됩니다.');
      }
      function loginGoogle() {
        alert('Google 로그인 준비 중입니다.\nFirebase Auth 설정 후 활성화됩니다.');
      }
      function loginEmail() {
        const email = document.getElementById('emailInput').value;
        const pw = document.getElementById('passwordInput').value;
        if (!email || !pw) { alert('이메일과 비밀번호를 입력해주세요.'); return; }
        alert('이메일 로그인 준비 중입니다.\nFirebase Auth 설정 후 활성화됩니다.');
      }
    </script>
    </main>
  <nav class="bottom-nav">
    <a href="/" class="">
      <span class="icon">🏠</span>홈
    </a>
    <a href="/list.html" class="">
      <span class="icon">📋</span>의원 목록
    </a>
    <a href="/community.html" class="">
      <span class="icon">💬</span>커뮤니티
    </a>
    <a href="/learn.html" class="">
      <span class="icon">📚</span>배움터
    </a>
  </nav>
</body>
</html>
